- name: Install graphical packages packages
  community.general.pacman:
    name: "{{ lookup('file', 'graphical_packages').splitlines() }}"
    state: latest

- name: copy swaylock and swayidle configs
  ansible.builtin.copy:
    src: files/{{ item }}
    dest: /home/coba/.config/
  with_items:
    - swaylock
    - swayidle

- name: Copy niri config
  ansible.builtin.copy:
    src: files/niri
    dest: /home/coba/.config/

- name: Make display-profile executable
  ansible.builtin.file:
    path: /home/coba/.config/niri/scripts/display-profile
    mode: "0755"

- name: Copy waybar config
  ansible.builtin.copy:
    src: files/waybar
    dest: /home/coba/.config/

- name: set es keyboard
  ansible.builtin.command: localectl set-x11-keymap es

- name: Swap Caps Lock and Escape on the internal keyboard
  ansible.builtin.copy:
    src: files/90-thinkpad-keyboard.hwdb
    dest: /etc/udev/hwdb.d/90-thinkpad-keyboard.hwdb
    owner: root
    group: root
    mode: "0644"
  notify:
    - Rebuild hardware database
    - Reapply input device configuration

- name: add user to video group
  ansible.builtin.user:
    name: coba
    groups: video
    append: yes

- name: Ensure the Default Applications section exists
  ansible.builtin.lineinfile:
    path: /home/coba/.config/mimeapps.list
    regexp: '^\[Default Applications\]$'
    line: "[Default Applications]"
    insertbefore: BOF
    create: true
    mode: "0644"
  become: yes
  become_user: coba
  become_method: su

- name: Set default browser MIME handlers
  ansible.builtin.lineinfile:
    path: /home/coba/.config/mimeapps.list
    regexp: '^{{ item }}='
    line: "{{ item }}=firefox.desktop"
    insertafter: '^\[Default Applications\]'
  loop:
    - text/html
    - x-scheme-handler/http
    - x-scheme-handler/https
    - x-scheme-handler/about
    - x-scheme-handler/unknown
  become: yes
  become_user: coba
  become_method: su

- name: Set default PDF handler
  ansible.builtin.lineinfile:
    path: /home/coba/.config/mimeapps.list
    regexp: '^application/pdf='
    line: "application/pdf=org.pwmt.zathura.desktop"
    insertafter: '^\[Default Applications\]'
  become: yes
  become_user: coba
  become_method: su

- name: Install graphical packages packages
  community.general.pacman:
    name: "{{ lookup('file', 'graphical_packages').splitlines() }}"
    state: latest

- name: copy xorg files
  ansible.builtin.copy:
    src: files/{{ item }}
    dest: /home/coba/
  with_items:
    - .xinitrc
    - .xserverrc
    - .Xkeymap-laptop

- name: copy i3 files
  ansible.builtin.copy:
    src: files/{{ item }}
    dest: /home/coba/.config/
  with_items:
    - i3
    - i3blocks
    - i3status

- name: copy swaylock and swayidle configs
  ansible.builtin.copy:
    src: files/{{ item }}
    dest: /home/coba/.config/
  with_items:
    - swaylock
    - swayidle

- name: set es keyboard
  ansible.builtin.command: localectl set-x11-keymap es

- name: Swap Caps Lock and Escape on the internal keyboard
  ansible.builtin.copy:
    src: files/90-thinkpad-keyboard.hwdb
    dest: /etc/udev/hwdb.d/90-thinkpad-keyboard.hwdb
    owner: root
    group: root
    mode: "0644"
  notify:
    - Rebuild hardware database
    - Reapply input device configuration

- name: add user to video group
  ansible.builtin.user:
    name: coba
    groups: video
    append: yes

- name: Configure trackpad
  # also install libinput gestures
  ansible.builtin.blockinfile:
    path: /etc/X11/xorg.conf.d/30-touchpad.conf
    create: true
    block: |
      Section "InputClass"
        Identifier "Touchpad"
        MatchIsTouchpad "on"
        Driver "libinput"
        Option "ClickMethod" "clickfinger"
        Option "Tapping" "on"
        Option "Accel Profile Enabled" "1 0 0"
        Option "Accel Speed" "1"
      EndSection

- name: Configure trackball
  ansible.builtin.blockinfile:
    path: /etc/X11/xorg.conf.d/41-trackball.conf
    create: true
    block: |
      Section "InputClass"
        Identifier "Logitech ERGO M575"
        MatchDriver "libinput"
        MatchProduct "Logitech USB Receiver Mouse"
        Option "Accel Profile Enabled" "1 0 0"
        Option "Accel Speed" "1"
      EndSection
